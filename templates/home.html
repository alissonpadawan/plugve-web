<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlugVE - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Menu de navegação -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-2">
          <img src="{{ url_for('static', filename='img/carro.png') }}" alt="Ícone" class="h-6 w-6">
          <span class="text-xl font-bold text-blue-600">PlugVE</span>
        </div>
        <div class="hidden md:flex space-x-6">
          <a href="/" class="text-blue-600 font-semibold">Início</a>
          <a href="/simular" class="text-gray-700 hover:text-blue-600 font-medium">Simular</a>
          <a href="/depreciacao" class="text-gray-700 hover:text-blue-600 font-medium">Depreciação</a>
          <a href="/metodologia" class="text-gray-700 hover:text-blue-600 font-medium">Metodologia</a>
          <a href="/sobre" class="text-gray-700 hover:text-blue-600 font-medium">Sobre</a>
          <a href="/contato" class="text-gray-700 hover:text-blue-600 font-medium">Contato</a>
        </div>
      </div>
    </nav>
  </header>

  <!-- Conteúdo principal -->
  <main class="max-w-7xl mx-auto px-4 py-10 sm:px-6 lg:px-8">
    <section class="text-center">
      <h1 class="text-4xl font-bold text-blue-700 mb-4">Bem-vindo ao PlugVE</h1>
      <p class="text-lg text-gray-600 mb-8">
        Uma ferramenta de apoio à decisão para investimentos em veículos elétricos.
      </p>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 my-8">
        <img id="veiculo-img" src="{{ url_for('static', filename='img/veiculo.jpeg') }}" alt="Veículo elétrico"
             class="rounded-xl object-cover w-full h-[350px] transition duration-300 shadow-md" />
        <img id="eletroposto-img" src="{{ url_for('static', filename='img/eletroposto.jpeg') }}" alt="Carregador elétrico"
             class="rounded-xl object-cover w-full h-[350px] transition duration-300 shadow-md" />
        <img id="sustentabilidade-img" src="{{ url_for('static', filename='img/sustentabilidade.jpeg') }}" alt="Sustentabilidade"
             class="rounded-xl object-cover w-full h-[350px] transition duration-300 shadow-md" />
      </div>
    </section>
  </main>

  <!-- Rodapé -->
  <footer class="bg-white border-t mt-10">
    <div class="max-w-7xl mx-auto px-4 py-6 text-center text-sm text-gray-500">
      &copy; 2025 PlugVE. Todos os direitos reservados.
    </div>
  </footer>

  <!-- Script de efeito sombra nas imagens -->
  <script>
    const imagens = [
      document.getElementById('veiculo-img'),
      document.getElementById('eletroposto-img'),
      document.getElementById('sustentabilidade-img')
    ];

    imagens.forEach(img => {
      img.addEventListener('mouseenter', () => {
        img.style.boxShadow = '0 12px 20px 4px rgba(34, 197, 94, 0.9)';
        img.style.transition = 'box-shadow 0.3s ease';
      });
      img.addEventListener('mouseleave', () => {
        img.style.boxShadow = 'none';
      });
    });
  </script>

</body>
</html>
