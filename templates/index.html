{% extends "base.html" %}

{% block title %}CurVE | Calculadora Veicular{% endblock %}

{% block content %}
<style>
  .curve-home-clean {
    width: 100vw;
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
    margin-top: -1.5rem;
    background: #f4faf7;
  }

  .curve-home-hero-photo {
    position: relative;
    width: 100%;
    min-height: calc(100vh - 86px);
    overflow: hidden;
    background: #eef5f1;
  }

  .curve-home-hero-photo img {
    display: block;
    width: 100%;
    height: calc(100vh - 86px);
    min-height: 560px;
    object-fit: cover;
    object-position: center center;
  }

  .curve-home-actions {
    position: absolute;
    left: 50%;
    bottom: clamp(28px, 6vh, 70px);
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 3;
    width: min(620px, calc(100% - 40px));
  }

  .curve-home-btn {
    min-width: 190px;
    text-align: center;
    border-radius: 999px;
    padding: 15px 30px;
    font-size: 1.05rem;
    line-height: 1;
    font-weight: 900;
    text-decoration: none;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
    box-shadow: 0 14px 30px rgba(15, 23, 42, .12);
  }

  .curve-home-btn:hover {
    transform: translateY(-2px);
  }

  .curve-home-btn-primary {
    background: #168a4a;
    border: 2px solid #168a4a;
    color: #fff;
  }

  .curve-home-btn-primary:hover {
    background: #0f6b39;
    border-color: #0f6b39;
    color: #fff;
    box-shadow: 0 18px 38px rgba(22, 138, 74, .24);
  }

  .curve-home-btn-secondary {
    background: rgba(255,255,255,.82);
    border: 2px solid #168a4a;
    color: #065f46;
    backdrop-filter: blur(8px);
  }

  .curve-home-btn-secondary:hover {
    background: #168a4a;
    color: #fff;
    box-shadow: 0 18px 38px rgba(22, 138, 74, .20);
  }

  @media (max-width: 900px) {
    .curve-home-clean {
      margin-top: -1rem;
    }
    .curve-home-hero-photo img {
      height: calc(100vh - 78px);
      min-height: 540px;
      object-position: center center;
    }
    .curve-home-actions {
      flex-direction: column;
      bottom: 24px;
      gap: 12px;
    }
    .curve-home-btn {
      width: min(360px, 100%);
    }
  }
</style>

<section class="curve-home-clean" aria-label="Página inicial CurVE">
  <div class="curve-home-hero-photo">
    <img
      src="{{ url_for('static', filename='img/curve-home-main.png') }}"
      alt="CurVE — decisão com dados para comparação veicular"
      loading="eager"
      decoding="async"
    >

    <div class="curve-home-actions" aria-label="Ações principais">
      <a class="curve-home-btn curve-home-btn-primary" href="/simular">Simulação</a>
      <a class="curve-home-btn curve-home-btn-secondary" href="/depreciacao">Depreciação</a>
    </div>
  </div>
</section>
{% endblock %}
