<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CurVE | Calculadora Veicular{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/favicon-180.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=20260705_v35_marcadores_unificados">
</head>
<body class="internal-page">
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="/" aria-label="CurVE Calculadora Veicular">
        <img src="{{ url_for('static', filename='img/logo_curve_horizontal.png') }}" alt="CurVE Calculadora Veicular">
      </a>
      <nav class="site-nav" aria-label="Menu principal">
        <a href="/" class="{% if request.path == '/' %}active{% endif %}">Início</a>
        <a href="/simular" class="{% if request.path.startswith('/simular') %}active{% endif %}">Simular</a>
        <a href="/depreciacao" class="{% if request.path.startswith('/depreciacao') %}active{% endif %}">Depreciação</a>
        <a href="/consulta-fipe" class="{% if request.path.startswith('/consulta-fipe') or request.path == '/fipe' %}active{% endif %}">Consulta FIPE</a>
        <a href="/sobre" class="{% if request.path.startswith('/sobre') %}active{% endif %}">Sobre</a>
        <a href="/contato" class="{% if request.path.startswith('/contato') %}active{% endif %}">Contato</a>
      </nav>
    </div>
  </header>

  <main class="container page site-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">CurVE © 2026 — Instituto Federal de Goiás. Todos os direitos reservados.</div>
  </footer>

  <script src="{{ url_for('static', filename='js/curve_marcadores_curvas.js') }}?v=20260705_v35_marcadores_unificados"></script>
  {% block scripts %}{% endblock %}
  <script src="{{ url_for('static', filename='js/fipe_combobox.js') }}?v=20260705_v35_marcadores_unificados"></script>
</body>
</html>
