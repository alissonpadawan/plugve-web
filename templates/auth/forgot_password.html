{% extends "auth/_base.html" %}
{% block title %}Recuperar senha — CurVE{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Esqueci minha senha</h1>
  <p>Informe seu e-mail. A resposta será sempre genérica para proteger a existência das contas.</p>
  {% if error %}<div class="auth-flash auth-flash-error">{{ error }}</div>{% endif %}
  <form method="post" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>E-mail<input type="email" name="email" autocomplete="email" required></label>
    <button class="auth-btn auth-btn-primary" type="submit">Enviar instruções</button>
  </form>
  <div class="auth-links"><a href="{{ url_for('auth.login') }}">Voltar ao login</a></div>
</section>
{% endblock %}
