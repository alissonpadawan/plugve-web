<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}Acesso CurVE{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=51_35">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}?v=51_35">
</head>
<body class="auth-page">
  <header class="auth-header">
    <a href="{{ url_for('main.index') }}" class="auth-brand" aria-label="CurVE">
      <img src="{{ url_for('static', filename='img/logo_curve_horizontal.png') }}" alt="CurVE">
    </a>
  </header>
  <main class="auth-shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="auth-flashes" aria-live="polite">
          {% for category, message in messages %}<div class="auth-flash auth-flash-{{ category }}">{{ message }}</div>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="auth-footer">
    <a href="{{ url_for('auth.privacy') }}">Política de Privacidade</a>
    <span>·</span>
    <a href="{{ url_for('auth.terms') }}">Termos de acesso</a>
  </footer>
</body>
</html>
