{% extends "auth/_base.html" %}
{% block title %}Redefinir senha — CurVE{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Redefinir senha</h1>
  <p>Use o código temporário enviado por e-mail.</p>
  {% if error %}<div class="auth-flash auth-flash-error">{{ error }}</div>{% endif %}
  <form method="post" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>E-mail<input type="email" name="email" autocomplete="email" required></label>
    <label>Código<input class="auth-code" type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label>
    <label>Nova senha<input type="password" name="password" minlength="{{ minimum_password }}" autocomplete="new-password" required><small>Mínimo de {{ minimum_password }} caracteres.</small></label>
    <label>Confirmar nova senha<input type="password" name="password_confirm" minlength="{{ minimum_password }}" autocomplete="new-password" required></label>
    <button class="auth-btn auth-btn-primary" type="submit">Salvar nova senha</button>
  </form>
</section>
{% endblock %}
