{% extends "base.html" %}

{% block title %}Contato | CurVE{% endblock %}

{% block content %}
<section class="hero card form-card">
  <span class="home-kicker">Contato</span>
  <h1>Fale com a CurVE</h1>
  <p>
    Envie dúvidas, sugestões ou observações sobre a plataforma de TCO, depreciação e análise veicular.
  </p>
</section>

<form action="#" method="POST" class="card form-card">
  <div class="field">
    <label for="nome">Nome completo</label>
    <input type="text" id="nome" name="nome" required>
  </div>
  <div class="field">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required>
  </div>
  <div class="field">
    <label for="mensagem">Mensagem</label>
    <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
  </div>
  <div class="actions">
    <button type="submit" class="button primary">Enviar</button>
  </div>
</form>
{% endblock %}
